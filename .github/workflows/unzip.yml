name: Unzip stampdesk-free.zip

on:
  push:
    paths: [".github/workflows/unzip.yml"]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo root
        run: |
          unzip -o -q stampdesk-free.zip -d /tmp/x
          rm -rf /tmp/x/stampdesk-free/.pytest_cache /tmp/x/stampdesk-free/.github
          cp -a /tmp/x/stampdesk-free/. .
          touch .nojekyll
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Unzip stampdesk-free.zip into repository root"
          git push
